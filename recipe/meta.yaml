{% set name = "pyXDSM" %}
{% set version = "2.3.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/mdolab/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f7fc49c12752f4ea0b2ae1ad310a600b6440b3ad7c67512f4e2e08712f8b0699

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - numpy >=1.21
    - python >={{ python_min }}

test:
  imports:
    - pyxdsm
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mdolab/pyXDSM
  summary: Python script to generate PDF XDSM diagrams using TikZ and LaTeX
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - AntoineD
